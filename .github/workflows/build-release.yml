name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            python: "3.12"
            artifact: PPD-Resume-windows-x64
            archive: PPD-Resume-windows-x64.zip
          - os: ubuntu-latest
            label: linux-x64
            python: "3.12"
            artifact: PPD-Resume-linux-x64
            archive: PPD-Resume-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libcanberra-gtk3-module \
            gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.0"

      - name: Build with PyInstaller
        run: python -m PyInstaller ppd.spec --noconfirm --clean

      - name: Bundle Typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/PPD-Resume"
          New-Item -ItemType Directory -Force -Path "$dist/tools", "$dist/data/source", "$dist/output" | Out-Null
          $zipUrl = "https://github.com/typst/typst/releases/download/v$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile "$env:RUNNER_TEMP/typst.zip" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP/typst.zip" -DestinationPath "$env:RUNNER_TEMP/typst-extract" -Force
          $typst = Get-ChildItem -Path "$env:RUNNER_TEMP/typst-extract" -Recurse -Filter "typst.exe" | Select-Object -First 1
          Copy-Item $typst.FullName "$dist/tools/typst.exe" -Force

      - name: Bundle Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          dist="dist/PPD-Resume"
          mkdir -p "$dist/tools" "$dist/data/source" "$dist/output"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst-extract
          tar -xJf /tmp/typst.tar.xz -C /tmp/typst-extract
          typst_bin="$(find /tmp/typst-extract -name typst -type f | head -1)"
          cp "$typst_bin" "$dist/tools/typst"
          chmod +x "$dist/tools/typst" "$dist/PPD-Resume"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/PPD-Resume" -DestinationPath "${{ matrix.archive }}"

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C dist PPD-Resume

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: PPD-Resume-windows-x64
          path: release-assets

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: PPD-Resume-linux-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/PPD-Resume-windows-x64.zip
            release-assets/PPD-Resume-linux-x64.tar.gz
          body: |
            ## Install

            ### Windows
            1. Download `PPD-Resume-windows-x64.zip`
            2. Extract the folder and run `PPD-Resume.exe`

            ### Linux
            1. Download `PPD-Resume-linux-x64.tar.gz`
            2. Extract: `tar -xzf PPD-Resume-linux-x64.tar.gz`
            3. Run: `./PPD-Resume/PPD-Resume`

            Requires WebKit/GTK on Linux (`libwebkit2gtk-4.1-0`, `libgtk-3-0`).

            Your resume data is stored next to the executable in `data/` and `output/`.
