[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppd"
version = "0.1.0"
description = "Personal resume system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pytesseract>=0.3",
    "pywebview>=5.0",
]

[project.scripts]
ppd = "ppd.cli:main"
ppd-gui = "ppd.gui_web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ppd*"]